<style>
:root{--bg:#eaf0ef;--card:#fff;--ink:#10282a;--mut:#5d7274;--pri:#0f766e;--on:#fff;--amb:#b45309;--ok:#15803d;--line:#d3dfde;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:never){:root:not([data-theme="light"]){--bg:#0d1617;--card:#162224;--ink:#e6f0ef;--mut:#8fa6a8;--pri:#2dd4bf;--on:#04201d;--amb:#fbbf24;--ok:#4ade80;--line:#263739;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0d1617;--card:#162224;--ink:#e6f0ef;--mut:#8fa6a8;--pri:#2dd4bf;--on:#04201d;--amb:#fbbf24;--ok:#4ade80;--line:#263739;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:20px;font-weight:800;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0;max-width:980px;margin:0 auto}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:980px;margin:0 auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{font-style:normal;color:var(--amb);font-weight:800;margin-inline-start:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dish{text-align:start;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;cursor:pointer;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;direction:ltr}
.dish b{font-weight:600;font-size:14px}.dish span{color:var(--pri);font-weight:800}
.dish:active{transform:scale(.98)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.nm{flex:1;direction:ltr;text-align:start}
.q{display:flex;align-items:center;gap:6px}
.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.note{font-size:13px;margin-top:4px}
.btn{border:0;background:var(--pri);color:var(--on);padding:11px 16px;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.w{background:var(--amb);color:#fff}.btn.d{background:var(--bad);color:#fff}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.tot{display:flex;justify-content:space-between;color:var(--mut)}
.tot.g{color:var(--ink);font-size:19px;font-weight:800;margin-top:4px}
.mut{color:var(--mut)}.tag{font-size:12px;color:var(--ok);font-weight:600}
.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.k .box{margin:0}.k .new{border-inline-start:5px solid var(--amb)}.k .ready{border-inline-start:5px solid var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--pri)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:85vh;overflow:auto}
label.x{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;direction:ltr}
label.x.on{border-color:var(--pri);background:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
@media print{.top,nav,main{display:none!important}.md{position:static;background:none;padding:0}.md>div{max-width:none}.btns{display:none}}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.fab{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:#2e9e5b;color:#fff;font-size:34px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:5}

.mh{display:flex;align-items:center;gap:10px;padding:4px}.mh button{border:0;background:none;color:var(--ink);font-size:22px;cursor:pointer}.mh b{flex:1;font-size:18px;cursor:pointer}

.sendbar{position:fixed;left:0;right:0;bottom:0;background:#2e9e5b;color:#fff;text-align:center;font-weight:800;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer;z-index:6}

nav{max-width:none;margin:0;padding:0;gap:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}

main>.chips{background:#fff;margin:0 -12px 10px;padding:0;gap:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}

.chip.on{background:#fff;color:#444;border-bottom-color:#3d91d4}
main>.mh{background:#3d91d4;margin:-12px -12px 0;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px}main>.mh button,main>.mh b{color:#fff;font-weight:400}
.fab,.sendbar{background:#5cb85c}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tb{background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:14px 8px;text-align:center;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tb b{font-size:28px;font-weight:400}.tb small{color:var(--mut)}.tb span{color:#3d91d4;font-weight:700}
.tb.oc{background:#fdfbd7}.tb.tk{background:#e8f4ea}
.lgb{border:1px solid rgba(255,255,255,.7);background:none;color:#fff;border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer;flex:none}
.rg{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.tb.rm{min-height:60px;padding:8px 4px}.tb.rm b{font-size:20px}.tb.tk{grid-column:1/-1;min-height:60px}
.lgo{height:46px;max-width:100%;object-fit:contain;display:block}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>(S.set.cur??'$')+(+(+n).toFixed(2));
let S={tables:{},orders:[],sales:[],pays:{},meta:{},menuText:DEF,set:{service:0,tax:0},staff:'Admin:1234:admin\nCashier:0000:cashier',seq:1,ver:2};
try{const r=localStorage.getItem('sc-v1');if(r){const o=JSON.parse(r);if(o.ver!=2)delete o.menuText;S=Object.assign(S,o,{ver:2})}}catch(e){}
let DB=null,lastL='',lastC='',tm;
const live=()=>JSON.stringify({tables:S.tables,orders:S.orders.filter(o=>o.status!='served').slice(-60),pays:S.pays,meta:S.meta,seq:S.seq});
const conf=()=>JSON.stringify({menuText:S.menuText,set:S.set,staff:S.staff});
function save(){try{localStorage.setItem('sc-v1',JSON.stringify(S))}catch(e){}if(!DB)return;clearTimeout(tm);tm=setTimeout(()=>{const l=live(),c=conf();if(l!=lastL){lastL=l;DB.doc('sc/live').set({j:l}).then(()=>{SY.w++;SY.err=''}).catch(sErr)}if(c!=lastC){lastC=c;DB.doc('sc/config').set({j:c}).then(()=>{SY.w++;SY.err=''}).catch(sErr)}},250)}
let ui={tab:'order',table:'',cat:0,view:'home',ocat:1,md:null,rst:false};
const TBL=()=>[...Array(+S.set.tables||12)].map((_,i)=>String(i+1)).concat('سفري');
const NUM=/^(.*?)\s+(\d+(?:\.\d+)?)$/;
function parse(t){const cats=[];let c,d;t.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='+'){const x=l.slice(1).trim().match(NUM);if(d&&x)d.extras.push({name:x[1],price:+x[2]});return}const m=l.match(NUM);if(m){if(!c){c={name:'عام',dishes:[]};cats.push(c)}d={name:m[1],price:+m[2],extras:[]};c.dishes.push(d)}else{c={name:l,dishes:[]};cats.push(c);d=null}});return cats}
let MENU=parse(S.menuText);
const cart=()=>S.tables[ui.table]||[];
const lab=id=>{const m=S.meta[id];return m?(m.label||'Order '+new Date(m.time).toTimeString().slice(0,5)):'طاولة '+id};

const qtyOf=n=>cart().filter(i=>!i.void&&(i.name==n||i.name.startsWith(n+' + '))).reduce((a,i)=>a+i.qty,0);

function initDB(){try{let c=window.FIREBASE_CONFIG;if(!c||!c.projectId){try{c=JSON.parse(localStorage.getItem('sc-fb-config')||'null')}catch(e){c=null}}if(!c||!c.projectId||!window.firebase)return null;firebase.initializeApp(c);const f=firebase.firestore();try{f.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}try{f.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}const bad=e=>{SY.err=(e&&e.code)||'error';try{toast('مشكلة في المزامنة ('+SY.err+'): '+({'permission-denied':'قواعد Firestore تمنع الوصول','unavailable':'لا يوجد اتصال أو القاعدة غير مفعلة','not-found':'قاعدة Firestore غير منشأة'}[SY.err]||'راجع إعدادات Firebase'))}catch(x){}};f.doc('sc/ping').set({t:Date.now()}).then(()=>{SY.err=''}).catch(bad);f.doc('sc/ping').onSnapshot(()=>{},bad);return f}catch(e){return null}}

async function savePDF(s){const st=$('#pm');try{const c=rcCanvas(s),b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),j=new Uint8Array(b.length);for(let i=0;i<b.length;i++)j[i]=b.charCodeAt(i);
const d=DL;if(!d){st.textContent='الحفظ غير متاح هنا. استخدم الطباعة ثم اختر «حفظ كـ PDF».';return}
await d.save({filename:'invoice-'+(s.id%100000)+'.pdf',data:mkPDF(j,c.width,c.height)});st.textContent='تم'}catch(e){st.textContent=e&&e.code=='declined'?'تم الإلغاء':'تعذّر الحفظ'}}
const staffList=()=>S.staff.split('\n').map(l=>l.trim().split(':')).filter(a=>a.length>=3).map(a=>({name:a[0],pin:a[1].trim(),role:a[2].trim()}));
const nd=s=>String(s==null?'':s).trim().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)),nu=s=>nd(s).toLowerCase();
function vLogin(){return`<div class="box" style="max-width:340px;margin:40px auto;text-align:center"><b>تسجيل الدخول</b><input id="usr" placeholder="اسم المستخدم" autocomplete="username" style="margin-top:10px"><input id="pin" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="margin-top:8px">${ui.err?'<p style="color:var(--bad)">بيانات الدخول غير صحيحة</p>':''}<div class="btns"><button class="btn" data-act="login">دخول</button></div></div>`}
document.addEventListener('input',e=>{if(e.target.id=='qs'){ui.q=e.target.value;render();const x=$('#qs');x.focus();x.setSelectionRange(x.value.length,x.value.length)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.act=='dr'){ui[t.dataset.f]=t.value;render()}});
document.addEventListener('change',e=>{const t=e.target;
if(['mp','mr','ma'].includes(t.id)){const pk=$('#mp').value.split('\n').map(l=>l.trim()).filter(l=>l.includes(':')).map(l=>'pick '+l).join('\n');S.set.mods=(pk?pk+'\n':'')+'remove: '+$('#mr').value.replace(/\n/g,',').trim()+'\nadd: '+$('#ma').value.replace(/\n/g,',').trim();save()}
else if(t.id=='logof'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,480/im.width,200/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');if(u.length>250000)u=c.toDataURL('image/jpeg',.85);S.set.logo=u;save();render()};im.onerror=()=>toast('تعذّر قراءة الصورة');im.src=fr.result};fr.readAsDataURL(t.files[0])}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='pin'||e.target.id=='usr'))document.querySelector('[data-act=login]').click()});
const stArr=()=>S.staff.split('\n').filter(l=>l.trim()).map(l=>{const a=l.split(':');return[a[0]||'',a[1]||'',a[2]||'cashier']});
const loadXLSX=()=>window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('xlsx'));document.head.appendChild(s)});
function parseCSV(t){const dl=[',',';','\t'].map(c=>[c,t.split('\n')[0].split(c).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==dl){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x!==''))rows.push(r);return rows}
function rowsToCats(rows){let ni=0,pi=1,ci=2,st=0;const hd=rows[0].map(x=>String(x).trim().toLowerCase()),fi=re=>hd.findIndex(x=>re.test(x));
const n=fi(/^(name|item|dish|product|الاسم|اسم|صنف)/),p=fi(/price|سعر/),c=fi(/categ|section|group|قسم|فئة/);if(n>=0&&p>=0){ni=n;pi=p;ci=c;st=1}
const cats=[],ix={};let skipped=0;
for(let i=st;i<rows.length;i++){const r=rows[i],nm=String(r[ni]==null?'':r[ni]).trim(),pr=parseFloat(String(r[pi]==null?'':r[pi]).replace(/[^\d.\-]/g,''));if(!nm||isNaN(pr)){skipped++;continue}
let cn=ci>=0?String(r[ci]==null?'':r[ci]).trim():'';if(!cn)cn='عام';if(/\d$/.test(cn))cn+=' •';
let c2=ix[cn.toLowerCase()];if(!c2){c2=ix[cn.toLowerCase()]={name:cn,dishes:[]};cats.push(c2)}c2.dishes.push({name:nm,price:pr,extras:[]})}
return{cats,skipped}}
async function readMenuFile(f){const n=f.name.toLowerCase();let res;
try{if(/\.(xlsx|xls)$/.test(n)){await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).filter(r=>r.some(x=>String(x).trim()!==''));res=rows.length?rowsToCats(rows):{cats:[],skipped:0}}
else{const t=(await f.text()).replace(/^\uFEFF/,'');if(/\.csv$/.test(n)){const rows=parseCSV(t);res=rows.length?rowsToCats(rows):{cats:[],skipped:0}}else res={cats:parse(t),skipped:0}}}
catch(e){toast('تعذّر قراءة الملف');return}
if(!res.cats.length||!res.cats.some(c=>c.dishes.length)){toast('لم أجد أصنافًا في الملف');return}
ui.imp={cats:res.cats,skipped:res.skipped,name:f.name};ui.md={t:'imp'};render()}
function applyImp(merge){const imp=ui.imp.cats;if(!merge)MENU=imp.map(c=>({name:c.name,dishes:c.dishes.slice()}));else imp.forEach(c=>{let t=MENU.find(x=>x.name.toLowerCase()==c.name.toLowerCase());if(!t){t={name:c.name,dishes:[]};MENU.push(t)}c.dishes.forEach(d=>{const o=t.dishes.find(x=>x.name.toLowerCase()==d.name.toLowerCase());if(o)o.price=d.price;else t.dishes.push({name:d.name,price:d.price,extras:d.extras||[]})})});
S.menuText=toText(MENU);ui.cat=0;ui.ec=0;ui.md=null;ui.imp=null;save();toast('تم تحديث القائمة')}
function dlBlob(name,text){try{DL.save({filename:name,data:new Blob(['\uFEFF'+text],{type:'text/csv'})})}catch(e){toast('تعذّر الحفظ')}}
const csvq=s=>'"'+String(s).replace(/"/g,'""')+'"';
const toText=M=>M.map(c=>c.name+'\n'+c.dishes.map(d=>d.name+' '+d.price+'\n'+d.extras.map(e=>'+ '+e.name+' '+e.price+'\n').join('')).join('')).join('');
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act,v=t.value,k=t.dataset.k;
if(t.id=='menuf'){if(t.files&&t.files[0])readMenuFile(t.files[0]);t.value='';return}
if(a=='gen'){S.set[t.dataset.f]=t.type=='number'?Math.max(0,+v||0):v}
else if(a=='mn'){const c=MENU[+t.dataset.c];if(k=='cn')c.name=v.replace(/\s*\d+$/,'').trim()||c.name;else{const d=c.dishes[+t.dataset.d];if(k=='dn')d.name=v.trim()||d.name;else d.price=Math.max(0,+v||0)}S.menuText=toText(MENU)}
else if(a=='st'){const s=stArr();s[+t.dataset.i][+t.dataset.f]=v.replace(/:/g,'').trim();S.staff=s.map(x=>x.join(':')).join('\n')}
else return;save();render()});
if(!staffList().length)ui.user={name:'',role:'admin'};
const rr=()=>{if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()};
(async()=>{DB=initDB();
if(!DB)return;
DB.doc('sc/live').onSnapshot(s=>{if(s.metadata.hasPendingWrites||(s.metadata.fromCache&&!s.exists))return;const j=s.exists&&s.data().j;if(j){if(j!=lastL){lastL=j;SY.r++;const o=JSON.parse(j);S.tables=o.tables;S.orders=o.orders;S.pays=o.pays||{};S.meta=o.meta||{};S.seq=o.seq;rr()}}else DB.doc('sc/live').set({j:lastL=live()}).catch(sErr)},sErr);
DB.doc('sc/config').onSnapshot(s=>{if(s.metadata.hasPendingWrites||(s.metadata.fromCache&&!s.exists))return;const j=s.exists&&s.data().j;if(j){if(j!=lastC){lastC=j;SY.r++;const o=JSON.parse(j);S.menuText=o.menuText;S.set=o.set;S.staff=o.staff;MENU=parse(S.menuText);if(ui.cat>=MENU.length)ui.cat=0;rr()}}else DB.doc('sc/config').set({j:lastC=conf()}).catch(sErr)},sErr);
DB.collection('sc_sales').orderBy('time','desc').limit(1500).onSnapshot(q=>{S.sales=q.docs.map(d=>JSON.parse(d.data().j));rr()},sErr)})();
if(!ui.user){try{const u=JSON.parse(localStorage.getItem('sc-u')||'null');if(u&&u.name!==undefined)ui.user=u}catch(e){}}
try{ui.lang=localStorage.getItem('sc-lang')||'ar'}catch(e){ui.lang='ar'}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
